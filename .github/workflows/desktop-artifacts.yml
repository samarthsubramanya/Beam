name: Desktop artifacts

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macos
            task: packageDmg
            pattern: "desktopApp/build/compose/binaries/main/dmg/*.dmg"
          - os: windows-latest
            label: windows
            task: packageMsi
            pattern: "desktopApp/build/compose/binaries/main/msi/*.msi"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      # Installer version must be numeric MAJOR.MINOR.BUILD, so it uses the run number; the UTC
      # timestamp goes in the artifact file name.
      - name: Compute version
        shell: bash
        run: |
          echo "VERSION=1.0.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "STAMP=$(date -u +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Package
        shell: bash
        run: ./gradlew :desktopApp:${{ matrix.task }} -Pbeam.version="$VERSION" --no-daemon

      - name: Name the artifact
        shell: bash
        run: |
          set -e
          f=$(ls ${{ matrix.pattern }} | head -n 1)
          ext="${f##*.}"
          mkdir -p dist
          cp "$f" "dist/Beam-${VERSION}-${STAMP}-${{ matrix.label }}.${ext}"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Beam-${{ matrix.label }}-${{ env.VERSION }}-${{ env.STAMP }}
          path: dist/*
          if-no-files-found: error
